<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>Page Not Found | J&amp;N StructureWorks</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif; }
      main { max-width: 560px; text-align: center; }
      img { width: 220px; height: auto; margin-bottom: 28px; }
      p:first-of-type { color: #f97316; font-weight: 700; text-transform: uppercase; }
      h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 8px 0 16px; }
      .message { color: #475569; font-size: 1.1rem; line-height: 1.6; }
      a { display: inline-block; margin-top: 24px; padding: 14px 22px; border-radius: 6px; background: #f97316; color: white; font-weight: 700; text-decoration: none; }
      a:hover { background: #ea580c; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.webp" alt="J&amp;N StructureWorks, LLC.">
      <p>404 error</p>
      <h1>Page not found</h1>
      <p class="message">The page may have moved or the address may be incorrect. Visit the homepage to explore our residential and commercial construction services.</p>
      <a href="/">Return to the homepage</a>
    </main>
  </body>
</html>
